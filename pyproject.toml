[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "novascientist"
version = "2.3.0"
description = "Evidence-First AI Research Orchestration & Reproducibility Infrastructure"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]
ignore = [
    "E402",   # Module level import not at top of file
    "E501",   # Line length handled by ruff format
    "E741",   # Ambiguous variable name
    "F841",   # Local variable assigned but never used
    "SIM102", # Nested if statements
    "SIM105", # Use contextlib.suppress instead of try-except-pass
    "SIM108", # Use ternary operator instead of if-else block
    "SIM118", # Key in dict.keys()
    "B007",   # Loop control variable not used
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "B025",   # Duplicate exception block
    "B904",   # Within an except clause, raise exceptions with from err
    "B905",   # zip() without explicit strict= parameter
    "UP022",  # Prefer capture_output
    "UP042",  # Class inherits from both str and Enum
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
