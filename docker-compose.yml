version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novascientist-api
    ports:
      - "8000:8000"
    environment:
      - NOVASCIENTIST_ENV=production
      - NOVASCIENTIST_DATA_DIR=/app/.novascientist_data
      - NOVASCIENTIST_HOST=0.0.0.0
      - NOVASCIENTIST_PORT=8000
    volumes:
      - novascientist_data:/app/.novascientist_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novascientist-ui
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - NOVASCIENTIST_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  novascientist_data:
    driver: local
